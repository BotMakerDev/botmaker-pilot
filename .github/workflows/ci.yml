name: CI

# One workflow per repo, two jobs distinguished by trigger, not by file:
#
#   web  — every push and PR: `npm run build` in web/ (`tsc -b && vite build`). The gate. web/tsconfig.json
#          runs strict with noUnusedLocals + noUnusedParameters + noFallthroughCasesInSwitch, and nothing
#          else holds that typecheck at zero errors, because nothing else runs it.
#   apk  — version tags only: the Android/Capacitor build, whose APK is attached to the GitHub Release as
#          `botpilot.apk`. It needs the Android SDK and a Gradle build — minutes of CI for a shell that
#          changes far less often than web/ — which is why it stays off the push path.
#
# Studio's Remote Pilot dialog shows a QR code pointing at the stable permalink
# https://github.com/BotMakerDev/botmaker-pilot/releases/latest/download/botpilot.apk, which always resolves
# to the newest release's asset — so the phone can scan-and-install the latest build fast.
#
# Cut a release:  git tag v0.1.0 && git push origin v0.1.0
#
# The vitest suite is deliberately NOT run here: CI is a build gate, and the suite is run locally.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # create/update the GitHub Release and upload the APK asset

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck and build
        working-directory: web
        run: npm run build

  apk:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: web
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 because JReleaser builds this release's notes from the commits since the previous
      # tag, and a shallow clone has neither the previous tag nor the commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # `packages` is set because the action's default is `tools platform-tools`, and Google removed the
      # legacy `tools` package from the SDK repository (botmaker-remote v0.0.1 failed on it, 2026-09-17).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # Every release is signed by the ONE release key (tools/android-keystore-secret.sh in the umbrella sets
      # these organization secrets). Until 2026-09-30 this job ran assembleDebug, and a fresh runner makes a
      # fresh debug key, so no release could update another: Android's "App not installed". A tag without the
      # key is refused here rather than published unsigned.
      - name: Decode the release key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is not set: run tools/android-keystore-secret.sh from the umbrella"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # APP_VERSION is what the web UI reports and compares against the latest tag; -PappVersion is the
      # APK's versionName and (derived) versionCode. Both come from the tag, so neither can lag behind it.
      - name: Build web + sync + assemble APK
        env:
          APP_VERSION: ${{ github.ref_name }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm ci
          npm run build:web
          npx cap sync android
          cd android && ./gradlew assembleRelease -PappVersion="$GITHUB_REF_NAME" --no-daemon

      # The name is part of a contract, not a convenience: Studio's Remote Pilot QR code points at
      # releases/latest/download/botpilot.apk, so a phone scanning it gets a 404 the moment this is renamed.
      # The .sha256 beside it is what the in-app updater (ApkUpdater) checks the download against.
      - name: Stage APK as botpilot.apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk botpilot.apk
          sha256sum botpilot.apk | cut -d' ' -f1 > botpilot.apk.sha256

      # Without the `v` — jreleaser.yml's tagName is `v{{projectVersion}}`, so passing the tag whole would
      # have it look for `vv0.1.0`.
      - name: Resolve the version from the tag
        run: echo "JRELEASER_PROJECT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # The release, its assets and its notes are declared in jreleaser.yml. The tag is not — it was pushed
      # by the umbrella's release.sh, which is what orders a release across the eight repositories, the one
      # thing JReleaser has no way to express.
      #
      # This replaced softprops/action-gh-release, which attached the APK with NO BODY AT ALL. This
      # repository has no CHANGELOG.md and is the one module release.sh's changelog gate exempts, so the
      # notes are JReleaser's own commit-log changelog since the previous tag — strictly more than before.
      - name: Publish GitHub Release
        uses: jreleaser/release-action@v2
        with:
          version: 1.25.0
          arguments: full-release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
